name: KopiCash CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: advisor
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: advisor/requirements.txt
      - name: Test API and SQLite
        run: |
          python -m pip install -r requirements.txt
          python -m unittest -q
          for script in deploy/install.sh deploy/update.sh deploy/spirit-release.sh; do
            bash -n "$script"
          done
      - name: Test the wallet in Chromium
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          python tests/browser_mvp.py --revision "$GITHUB_SHA"
      - name: Build and start the deployment images
        run: |
          docker build -t kopicash-backend .
          docker build -f frontend/Dockerfile --build-arg ADVISOR_REVISION="$GITHUB_SHA" -t kopicash-frontend .
          docker network create kopicash-ci
          docker run -d --name advisor --network kopicash-ci -e ADVISOR_DB=/tmp/ci.sqlite3 \
            -e ADVISOR_BUILD_REVISION="$GITHUB_SHA" kopicash-backend
          docker run -d --name frontend --network kopicash-ci -p 127.0.0.1:8767:8080 kopicash-frontend
          for attempt in $(seq 1 20); do
            if python deploy/smoke.py http://127.0.0.1:8767 --revision "$GITHUB_SHA" --require-frontend; then
              exit 0
            fi
            sleep 1
          done
          docker logs advisor
          docker logs frontend
          exit 1

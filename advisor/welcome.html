<meta charset="utf-8">

<title>КопиКэш — больше кэшбэка</title>

<style>
:root {

  --glow:.32; --lift:8%; --shine-time:1100ms;
  font-family:var(--font-ui); color:var(--ink); background:var(--paper);
}
* {box-sizing:border-box}
body {margin:0}
button {font:inherit;color:inherit;cursor:pointer}
button:focus-visible {outline:3px solid var(--focus-ring);outline-offset:2px}
main {max-width:480px;margin:auto;min-height:100svh;padding:clamp(20px,4vh,40px) 24px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:clamp(12px,2.5vh,26px)}
.brand {display:flex;align-items:center;gap:9px;font-size:24px;font-weight:800;letter-spacing:-1.2px}
.mark {position:relative;width:26px;height:28px;display:inline-block}
.mark::before,.mark::after {content:'';position:absolute;width:16px;height:22px;top:1px;left:9px;border-radius:3px;background:#E6B423;transform:skewY(-15deg)}
.mark::after {top:5px;left:1px;background:var(--yellow);transform:skewY(8deg)}
h1 {font-size:clamp(34px,8.6vw,48px);line-height:.99;letter-spacing:-.062em;margin:10px 0 12px;font-weight:800}
p {font-size:clamp(16px,4.5vw,20px);line-height:1.32;margin:0;max-width:29ch;color:#484740}
.scene {flex:1;display:grid;place-items:center;position:relative;isolation:isolate;padding:14px 0}
.scene::before {content:'';position:absolute;inset:12% 1% 0;background:radial-gradient(ellipse,#f6c94a,transparent 67%);opacity:var(--glow);z-index:-1}
.wallet {width:min(76%,32svh,310px);aspect-ratio:650/840;position:relative;transform:rotate(2deg);filter:drop-shadow(6px 10px 7px #382d1d32);container-type:inline-size}
.back {position:absolute;inset:23% 0 0;background:#262521;border-radius:8% 8% 19% 19%}
.card {position:absolute;left:5%;width:90%;height:46%;border-radius:6cqw;border:1px solid #ffffff65;padding:2% 5%;text-align:right;font-size:12cqw;font-weight:800;letter-spacing:-.06em;overflow:hidden;box-shadow:0 -1px 2px #0002;animation:deal 760ms cubic-bezier(.17,.85,.23,1) backwards;transition:translate 400ms}
.charcoal {top:1%;background:linear-gradient(120deg,#575956,#363835);color:#fff;animation-delay:80ms}
.silver {top:15%;background:linear-gradient(110deg,#ecece7,#bdbfbe);animation-delay:170ms}
.gold {top:29%;background:linear-gradient(105deg,#ffdb31,#ffc400);animation-delay:260ms}
.gold::after {content:'';position:absolute;inset:-30%;background:linear-gradient(108deg,transparent 38%,#fff8 49%,transparent 60%);transform:translateX(-110%);animation:shine var(--shine-time) ease-out 800ms}
.pocket {position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
@keyframes deal {from {transform:translateY(44%)}}
@keyframes shine {to {transform:translateX(110%)}}
@media (hover:hover) {.wallet:hover .gold {translate:0 calc(-1 * var(--lift))}}
.action {background:var(--accent);color:var(--accent-ink);font-weight:700;min-height:var(--touch);display:flex;align-items:center;justify-content:space-between;width:100%;border:0;border-radius:var(--control-radius);padding:16px 21px;font-size:18px;transition:transform var(--control-ease),filter var(--control-ease)}
.action:hover {box-shadow:0 4px 22px #f1bd0044}
.action:active {transform:scale(.985)}
dialog {color:var(--ink);background:var(--paper);border:0;border-radius:20px;padding:26px;width:min(90vw,360px);box-shadow:0 20px 90px #0003}
dialog::backdrop {background:#16161070}
dialog h2 {margin:0 0 12px;font-size:26px;letter-spacing:-.04em}
dialog p {margin:0 0 24px}
@media (min-width:760px) {
 main {max-width:1100px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr auto;min-height:min(100svh,900px);padding:6vh 5vw;column-gap:5vw}
 .brand {grid-column:1/-1} header {align-self:end} h1 {font-size:clamp(50px,5.8vw,82px)}
 .scene {grid-column:2;grid-row:2/4} .wallet {width:min(90%,39svh,355px)}
 main>.action {max-width:310px;align-self:start;margin:12px 0 7vh}
}
@media (prefers-reduced-motion:reduce) {*,*::before,*::after {animation:none!important;transition:none!important} .wallet:hover .gold {translate:none}}
</style>

map $http_x_forwarded_proto $advisor_scheme {
    default $scheme;
    https https;
    http http;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 8m;
    add_header Cache-Control no-store;

    # Resolve again after a backend container is replaced.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $advisor_upstream advisor:8766;

    location ~ ^/(api/pwa/)?manifest\.webmanifest$ {
        default_type application/manifest+json;
        try_files /static/manifest.webmanifest =404;
    }

    location ~ ^/(api/pwa/)?sw\.js$ {
        default_type text/javascript;
        add_header Service-Worker-Allowed /;
        add_header Cache-Control no-store;
        try_files /static/sw.js =404;
    }

    location ~ ^/(api/|healthz$|docs(?:/|$)|redoc$|openapi\.json$) {
        proxy_pass http://$advisor_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $advisor_scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 70s;
    }

    location / { try_files $uri $uri/ /index.html; }
}

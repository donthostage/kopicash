advisor:test:
  stage: test
  image: python:3.12-bookworm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH)'
      changes: ['advisor/**/*', '.gitlab-ci.yml']
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - bash advisor/deploy/ci-test.sh

.advisor_release:
  rules:
    - if: '$ADVISOR_DEPLOY_ENABLED == "1" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: ['advisor/**/*', '.gitlab-ci.yml']
    - if: '$ADVISOR_DEPLOY_ENABLED == "1" && $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

advisor:build:
  extends: [.dp_build, .advisor_release]
  needs: ['advisor:test']
  variables:
    DOCKERFILE_PATH: $CI_PROJECT_DIR/advisor/Dockerfile
    CONTEXT: $CI_PROJECT_DIR/advisor
  before_script:
    - export IMAGE_NAME="${DOCKER_ARTIFACTORY_REGISTRY}/${CI_PROJECT_ROOT_NAMESPACE}/${CI_PROJECT_NAME}:advisor-${CI_COMMIT_SHA}"
    - !reference [.dp_build, before_script]

advisor:deploy:
  extends: .advisor_release
  stage: deploy
  image: $DEPLOY_IMG
  needs: ['advisor:build', 'advisor:build-frontend']
  resource_group: production
  script:
    - bash advisor/deploy/ci-deploy.sh

advisor:build-frontend:
  extends: [.dp_build, .advisor_release]
  needs: ['advisor:test']
  variables:
    DOCKERFILE_PATH: $CI_PROJECT_DIR/advisor/frontend/Dockerfile
    CONTEXT: $CI_PROJECT_DIR/advisor
    KANIKO_ARGS: '--build-arg=ADVISOR_REVISION=${CI_COMMIT_SHA}'
  before_script:
    - export IMAGE_NAME="${DOCKER_ARTIFACTORY_REGISTRY}/${CI_PROJECT_ROOT_NAMESPACE}/${CI_PROJECT_NAME}:advisor-frontend-${CI_COMMIT_SHA}"
    - !reference [.dp_build, before_script]
